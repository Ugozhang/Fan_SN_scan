<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b45"><title>施工掃描 V0.1c</title><style>*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f1f5f5;color:#18343a;margin:0}main{max-width:560px;margin:auto;padding:18px}h1{font-size:24px;margin:0}p{line-height:1.5}section{background:white;border:1px solid #d6e0e0;border-radius:14px;padding:16px;margin:14px 0}.preview{position:relative;background:#172429;aspect-ratio:4/3;overflow:hidden;border-radius:10px}video{width:100%;height:100%;object-fit:contain}#guide{position:absolute;border:2px solid #6cf2ab;box-shadow:0 0 0 999px #0007;pointer-events:none;left:8%;top:30%;width:84%;height:40%;border-radius:5px}button,input{font:inherit;padding:12px;border-radius:8px;border:1px solid #a5b8ba}button{background:#14675f;color:white;font-weight:600;cursor:pointer;flex:1}button.secondary{background:white;color:#18343a}button:disabled{opacity:.45}input{width:100%;font:26px monospace;letter-spacing:1px} .row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.muted{font-size:13px;color:#52676b}#status{min-height:48px;white-space:pre-wrap}#result{white-space:pre-wrap;overflow-wrap:anywhere;font-family:monospace;font-size:14px}canvas{max-width:100%;display:none}canvas.visible{display:block}label{display:block;margin-bottom:8px;font-weight:600}[hidden]{display:none!important}.groups{display:flex;gap:12px}.groups label{flex:1;margin:0;position:relative}.groups input{position:absolute;opacity:0;width:1px}.groups span{display:block;border:1px solid #a5b8ba;border-radius:9px;padding:14px;text-align:center;font-size:22px}.groups input:checked+span{background:#14675f;color:white}.groups input:focus-visible+span{outline:3px solid #55a8ff}#cameraPanel{margin-top:12px}details{margin-top:12px}textarea,select{max-width:100%}#meterType,#meterNo,#moduleNo{font-size:22px}</style></head><body><main><h1>施工掃描回報</h1><p class="muted">V0.1c · 五欄簡化介面 · 尚未上傳施工資料</p>
<section id="powerSection"><label for="number">電號</label><input id="number" inputmode="numeric" maxlength="11" autocomplete="off" placeholder="11 碼電號"><div class="row"><button data-mode="power">開啟鏡頭辨識 11 碼</button></div><p id="valid" class="muted">等待輸入</p><div class="row" hidden style="display:none"><button id="copy">複製電號</button><button id="reset">清除</button></div><div id="powerMount"></div></section>
<section><label>電表組別</label><div class="groups"><label><input type="radio" name="operation" value="01"><span>01</span></label><label><input type="radio" name="operation" value="02"><span>02</span></label></div></section>
<section><label for="meterType">電表表型</label><input id="meterType" autocomplete="off" placeholder="例如 KT"><div class="row"><button data-mode="meter">QR 辨識</button></div><div id="meterMount"></div><details id="rawDetails"><summary>QR 原始內容／手動解析</summary><textarea id="rawQR" rows="3" style="width:100%;font:inherit"></textarea><div id="parts" class="row"></div><button id="parse" class="secondary">解析電表 QR</button></details></section>
<section><label for="meterNo">電表表號</label><input id="meterNo" autocomplete="off" placeholder="QR 自動填入，亦可手動修改"></section>
<section><label for="moduleNo">通訊模組序號</label><input id="moduleNo" autocomplete="off" placeholder="12 碼序號"><div class="row"><button data-mode="module">QR 辨識</button><button data-mode="moduleOCR" class="secondary">OCR 辨識</button></div><div id="moduleMount"></div></section>
<section><div class="row"><button id="copyAll">複製五欄</button><button id="clearAll" class="secondary">清除全部</button></div><p id="reportStatus" role="status" class="muted"></p></section>
<div id="cameraHome"><div id="cameraPanel" hidden><select id="mode" hidden><option value="power">電號 OCR</option><option value="meter">電表 QR</option><option value="module">模組 QR</option><option value="moduleOCR">模組 OCR</option></select><div class="preview" id="preview"><video id="video" playsinline muted></video><div id="guide"></div></div><p class="muted" id="hint"></p><div class="row"><button id="start" hidden style="display:none">開啟鏡頭</button><button id="once" disabled>單次辨識</button><button id="scan" class="secondary" disabled>開始連續辨識</button></div><div class="row"><button id="torch" class="secondary" disabled>補光</button><button id="stop" class="secondary">關閉鏡頭</button></div><p id="status" role="status">尚未開啟鏡頭。</p><details><summary>進階設定／照片測試／辨識診斷</summary><label for="area">OCR 辨識範圍</label><select id="area"><option value="crop">綠框</option><option value="full">整張畫面</option></select><label for="photo">測試照片</label><input type="file" id="photo" accept="image/*" style="font:inherit"><p id="result"></p><canvas id="canvas"></canvas></details></div></div>
<p class="muted">第一次使用需連網載入辨識程式及模型。照片不由本程式上傳。鏡頭需要 HTTPS 或 localhost。</p></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>
const $=id=>document.getElementById(id);const video=$('video'),canvas=$('canvas');let stream=null,worker=null,workerPromise=null,busy=false,running=false,epoch=0,timer=null,last='',count=0,torch=false;const status=t=>$('status').textContent=t;function validate(){const ok=/^[0-9]{11}$/.test($('number').value);$('valid').textContent=ok?'格式正確（仍需核對原始電號）':'需要完整 11 碼純數字';$('copy').disabled=!ok} $('number').oninput=validate;
function halt(){running=false;epoch++;clearTimeout(timer);$('scan').textContent='開始連續辨識';last='';count=0}function controls(){const active=!!stream;$('start').disabled=active;$('stop').disabled=!active;$('scan').disabled=!active;$('once').disabled=!active||busy;$('photo').disabled=busy;$('torch').disabled=!stream?.getVideoTracks()[0]?.getCapabilities?.().torch}
async function getWorker(){if(worker)return worker;if(!workerPromise){workerPromise=(async()=>{if(!window.Tesseract)throw Error('OCR 程式未載入，請檢查網路');status('首次載入 OCR 模型…');const w=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='loading language traineddata')status('下載 OCR 模型… '+Math.round(m.progress*100)+'%')}});await w.setParameters({tessedit_char_whitelist:'0123456789',tessedit_pageseg_mode:'7'});worker=w;return w})().catch(e=>{workerPromise=null;throw e})}return workerPromise}
let opening=false; $('start').onclick=async()=>{if(opening||stream)return;opening=true;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('需要 HTTPS 或 localhost 才能開啟鏡頭');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();status('鏡頭已開啟。'+modes[$('mode').value]);controls()}catch(e){stop();status('無法開啟鏡頭：'+e.message)}finally{opening=false}};function stop(){halt();stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;torch=false;controls()}$('stop').onclick=()=>{stop();status('鏡頭已關閉');$('cameraPanel').hidden=true};$('torch').onclick=async()=>{try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:!torch}]});torch=!torch;$('torch').textContent=torch?'關補光':'補光'}catch(e){status('裝置不支援補光：'+e.message)}};
function crop(){const v=video.getBoundingClientRect(),g=$('guide').getBoundingClientRect();const s=Math.min(v.width/video.videoWidth,v.height/video.videoHeight);if(!s||!video.videoWidth)throw Error('鏡頭尚未準備完成');const x0=v.left+(v.width-video.videoWidth*s)/2,y0=v.top+(v.height-video.videoHeight*s)/2;const x=Math.max(0,(g.left-x0)/s),y=Math.max(0,(g.top-y0)/s),r=Math.min(video.videoWidth,(g.right-x0)/s),b=Math.min(video.videoHeight,(g.bottom-y0)/s);if(r<=x||b<=y)throw Error('掃描框不在影像內');canvas.width=Math.round(r-x);canvas.height=Math.round(b-y);canvas.getContext('2d').drawImage(video,x,y,r-x,b-y,0,0,canvas.width,canvas.height)}
async function recognize(kind,img){if(busy)return;busy=true;controls();const token=epoch;try{if(kind==='photo'){const scale=Math.min(1,2200/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height)}else {const qr=['meter','module'].includes($('mode').value);if(!qr&&$('area').value==='full'){canvas.width=video.videoWidth;canvas.height=video.videoHeight;if(!canvas.width)throw Error('鏡頭尚未準備完成');canvas.getContext('2d').drawImage(video,0,0)}else crop();if(!qr&&$('area').value==='crop'){const temp=document.createElement('canvas');temp.width=canvas.width;temp.height=canvas.height;temp.getContext('2d').drawImage(canvas,0,0);const scale=Math.max(1,Math.min(3,1600/temp.width));canvas.width=Math.round(temp.width*scale);canvas.height=Math.round(temp.height*scale);const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(temp,0,0,canvas.width,canvas.height)}}canvas.classList.add('visible');const mode=$('mode').value;if(mode==='meter'||mode==='module'){scanQR(mode,token);return}const w=await getWorker();if(token!==epoch)return;await w.setParameters({tessedit_char_whitelist:'',tessedit_pageseg_mode:'11'});status('辨識中…');const {data}=await w.recognize(canvas);if(token!==epoch)return;$('result').textContent='影像：'+canvas.width+' × '+canvas.height+'；來源：'+(kind==='photo'?'照片':$('area').value==='full'?'整張鏡頭':'綠框')+'\n原始 OCR：\n'+(data.text.trim()||'（無文字）')+'\nOCR 信心值：'+data.confidence.toFixed(1);const candidates=[...new Set(data.text.toUpperCase().match(mode==='moduleOCR'?/(?<![A-Z0-9])[A-Z0-9]{12}(?![A-Z0-9])/g:/(?<![0-9])[0-9]{11}(?![0-9])/g)||[])];if(candidates.length!==1){last='';count=0;status(candidates.length?'找到多組電號，請縮小掃描範圍。':'未找到符合長度的字串，請調整角度、距離或光線。');return}const n=candidates[0];if(kind==='continuous'){count=n===last?count+1:1;last=n;if(count<3){status('候選電號：'+n+'（'+count+'/3）');return}}$(mode==='moduleOCR'?'moduleNo':'number').value=n;validate();halt();navigator.vibrate?.(100);status('已辨識：'+n+'\n請與紙本核對後再使用。')}catch(e){if(token===epoch){halt();status('辨識失敗：'+e.message)}}finally{busy=false;controls();if(running)timer=setTimeout(()=>recognize('continuous'),250)}}
$('scan').onclick=()=>{if(running){halt();status('已停止辨識');return}if(busy)return;halt();running=true;$('scan').textContent='停止連續辨識';recognize('continuous')};$('once').onclick=()=>{halt();recognize('once')};$('photo').onchange=async e=>{const f=e.target.files[0];if(!f||busy)return;halt();try{const img=await createImageBitmap(f);await recognize('photo',img);img.close()}catch(err){status('圖片讀取失敗：'+err.message)}finally{e.target.value=''}};$('reset').onclick=()=>{halt();$('number').value='';$('result').textContent='';validate();status('已清除，請重新辨識。')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('number').value);status('已複製電號')}catch{ $('number').select();status('請手動複製選取的電號')}};const modes={power:'將完整 11 碼電號落在綠框內。',meter:'將完整電表 QR Code 放進綠框。',module:'將完整模組 QR Code 放進綠框。',moduleOCR:'將完整 12 碼序號放進綠框。'};
$('area').onchange=()=>{halt();controls();status('已切換 OCR 範圍，請重新開始辨識。');$('guide').style.visibility=$('area').value==='full'&&!['meter','module'].includes($('mode').value)?'hidden':'visible'};$('mode').onchange=()=>{halt();const m=$('mode').value;const qr=m==='meter'||m==='module';Object.assign($('guide').style,qr?{left:'12%',top:'8%',width:'76%',height:'84%'}:{left:'8%',top:'30%',width:'84%',height:'40%'});$('guide').style.visibility=!qr&&$('area').value==='full'?'hidden':'visible';$('hint').textContent=modes[m];status('已切換：'+modes[m]);controls()};
function parseMeter(raw){const p=raw.trim().split(';').map(s=>s.trim());const match=p[1]?.match(/^([A-Z]{2})-[A-Z0-9]+$/);return p.length===4&&p[0]==='ACBEL'&&match&&/^[0-9]{8}$/.test(p[2])?{type:match[1],number:p[2]}:null}
function showParts(raw){$('parts').replaceChildren();for(const part of raw.split(/[;,|\s]+/).filter(Boolean)){for(const [label,id] of [['表型','meterType'],['表號','meterNo']]){const b=document.createElement('button');b.className='secondary';b.textContent=label+'：'+part;b.onclick=()=>{$(id).value=part};$('parts').append(b)}}}
function applyMeter(raw){$('rawQR').value=raw;$('meterType').value='';$('meterNo').value='';const parsed=parseMeter(raw);showParts(raw);if(parsed){$('meterType').value=parsed.type;$('meterNo').value=parsed.number;status('已解析電表 QR，請核對表型與表號。')}else{$('rawDetails').open=true;status('未知電表 QR 格式：請從原始內容選取或手動輸入表型與表號。')}}
$('parse').onclick=()=>{halt();applyMeter($('rawQR').value)};
function scanQR(mode,token){if(typeof jsQR!=='function')throw Error('QR 引擎未載入，請檢查網路');const img=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height);const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});if(token!==epoch)return;if(!code){status('未找到 QR Code，請調整距離或補光。');return}halt();$('result').textContent=code.data;navigator.vibrate?.(100);if(mode==='meter'){applyMeter(code.data)}else{$('moduleNo').value='';const s=code.data.trim();if(/^[A-Za-z0-9]{12}$/.test(s)){$('moduleNo').value=s;status('已取得模組序號，請核對標籤。')}else{status('未知模組 QR 格式：請查看辨識診斷，改用 OCR 或手動輸入。')}}}
$('copyAll').onclick=async()=>{const vals=[$('number').value,document.querySelector('input[name=operation]:checked')?.value||'',$('meterType').value.trim(),$('meterNo').value.trim(),$('moduleNo').value.trim()];if(!/^[0-9]{11}$/.test(vals[0])||!vals[1]||!vals[2]||!vals[3]||!/^[A-Za-z0-9]{12}$/.test(vals[4])||vals.some(v=>/[\t\r\n]/.test(v))){$('reportStatus').textContent='請確認五欄完整，電號 11 碼純數字、序號 12 碼英數。';return}try{await navigator.clipboard.writeText(vals.join('\t'));$('reportStatus').textContent='已複製五欄（Tab 分隔），未上傳。'}catch(e){$('reportStatus').textContent='無法複製：'+e.message}};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=async()=>{if(opening)return;const m=b.dataset.mode;$(m==='power'?'powerMount':m==='meter'?'meterMount':'moduleMount').append($('cameraPanel'));$('cameraPanel').hidden=false;$('mode').value=m;$('mode').onchange();if(!stream)await $('start').onclick();$('cameraPanel').scrollIntoView({block:'nearest',behavior:'smooth'});if(stream&&['meter','module'].includes(m)&&!busy)$('scan').onclick()});
$('clearAll').onclick=()=>{if(opening)return;stop();$('cameraPanel').hidden=true;for(const id of ['number','meterType','meterNo','moduleNo','rawQR'])$(id).value='';document.querySelectorAll('input[name=operation]').forEach(e=>e.checked=false);$('parts').replaceChildren();$('result').textContent='';$('rawDetails').open=false;$('reportStatus').textContent='已清除全部資料';validate()};
window.addEventListener('pagehide',stop);validate();controls();</script></body></html>
