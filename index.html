<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b45"><title>施工掃描 V0.1b</title><style>*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f1f5f5;color:#18343a;margin:0}main{max-width:560px;margin:auto;padding:18px}h1{font-size:24px;margin:0}p{line-height:1.5}section{background:white;border:1px solid #d6e0e0;border-radius:14px;padding:16px;margin:14px 0}.preview{position:relative;background:#172429;aspect-ratio:4/3;overflow:hidden;border-radius:10px}video{width:100%;height:100%;object-fit:contain}#guide{position:absolute;border:2px solid #6cf2ab;box-shadow:0 0 0 999px #0007;pointer-events:none;left:8%;top:39%;width:84%;height:22%;border-radius:5px}button,input{font:inherit;padding:12px;border-radius:8px;border:1px solid #a5b8ba}button{background:#14675f;color:white;font-weight:600;cursor:pointer;flex:1}button.secondary{background:white;color:#18343a}button:disabled{opacity:.45}input{width:100%;font:26px monospace;letter-spacing:1px} .row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.muted{font-size:13px;color:#52676b}#status{min-height:48px;white-space:pre-wrap}#result{overflow-wrap:anywhere;font-family:monospace;font-size:14px}canvas{max-width:100%;display:none}canvas.visible{display:block}label{display:block;margin-bottom:8px;font-weight:600}</style></head><body><main><h1>施工掃描回報</h1><p class="muted">V0.1b · OCR + QR 測試 · 不上傳施工資料</p><section><label for="mode">辨識目標</label><select id="mode" style="width:100%;padding:12px;font:inherit"><option value="power">電號 OCR</option><option value="meter">電表 QR</option><option value="module">模組 QR</option><option value="moduleOCR">模組序號 OCR</option></select><div class="preview" id="preview"><video id="video" playsinline muted></video><div id="guide"></div></div><p class="muted"><span id="hint">將完整 11 碼電號落在綠框內。</span></p><div class="row"><button id="start">開啟鏡頭</button><button id="stop" class="secondary" disabled>關閉</button><button id="torch" class="secondary" disabled>補光</button></div><div class="row"><button id="scan" disabled>開始連續辨識</button><button id="once" class="secondary" disabled>單次辨識</button></div><label for="photo">或選擇測試照片（辨識整張圖，依目前模式）</label><input type="file" id="photo" accept="image/*" style="font:inherit;letter-spacing:0"><p id="status" role="status">尚未開啟鏡頭。</p></section><section><label for="number">電號（11 碼）</label><input id="number" inputmode="numeric" maxlength="11" autocomplete="off" placeholder="00000000000"><p id="valid" class="muted">等待輸入</p><div class="row"><button id="copy" disabled>複製電號</button><button id="reset" class="secondary">清除電號／重掃</button></div><label>作業代碼</label><div class="row"><label><input type="radio" name="operation" value="01" style="width:auto"> 01</label><label><input type="radio" name="operation" value="02" style="width:auto"> 02</label></div><label for="meterType">電表類型</label><input id="meterType" autocomplete="off"><label for="meterNo">電表號碼</label><input id="meterNo" autocomplete="off"><label for="moduleNo">通訊模組序號</label><input id="moduleNo" autocomplete="off"><label for="rawQR">電表 QR 原始內容（可貼上測試）</label><textarea id="rawQR" rows="3" style="width:100%;font:inherit"></textarea><div id="parts" class="row"></div><div class="row"><button id="parse" class="secondary">解析電表 QR</button><button id="copyAll" class="secondary">複製五欄</button></div><p id="reportStatus" role="status" class="muted"></p><details><summary>辨識診斷</summary><p id="result"></p><canvas id="canvas"></canvas></details></section><p class="muted">第一次使用需要網路下載 OCR 程式及模型。鏡頭需要 HTTPS 或 localhost。影像不會由本程式上傳；第三方 CDN 會收到資源下載請求。</p></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>
const $=id=>document.getElementById(id);const video=$('video'),canvas=$('canvas');let stream=null,worker=null,workerPromise=null,busy=false,running=false,epoch=0,timer=null,last='',count=0,torch=false;const status=t=>$('status').textContent=t;function validate(){const ok=/^[0-9]{11}$/.test($('number').value);$('valid').textContent=ok?'格式正確（仍需核對原始電號）':'需要完整 11 碼純數字';$('copy').disabled=!ok} $('number').oninput=validate;
function halt(){running=false;epoch++;clearTimeout(timer);$('scan').textContent='開始連續辨識';last='';count=0}function controls(){const active=!!stream;$('start').disabled=active;$('stop').disabled=!active;$('scan').disabled=!active;$('once').disabled=!active||busy;$('photo').disabled=busy;$('torch').disabled=!stream?.getVideoTracks()[0]?.getCapabilities?.().torch}
async function getWorker(){if(worker)return worker;if(!workerPromise){workerPromise=(async()=>{if(!window.Tesseract)throw Error('OCR 程式未載入，請檢查網路');status('首次載入 OCR 模型…');const w=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='loading language traineddata')status('下載 OCR 模型… '+Math.round(m.progress*100)+'%')}});await w.setParameters({tessedit_char_whitelist:'0123456789',tessedit_pageseg_mode:'7'});worker=w;return w})().catch(e=>{workerPromise=null;throw e})}return workerPromise}
$('start').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('需要 HTTPS 或 localhost 才能開啟鏡頭');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();status('鏡頭已開啟，請對準電號。');controls()}catch(e){stop();status('無法開啟鏡頭：'+e.message)}};function stop(){halt();stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;torch=false;controls()}$('stop').onclick=()=>{stop();status('鏡頭已關閉')};$('torch').onclick=async()=>{try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:!torch}]});torch=!torch;$('torch').textContent=torch?'關補光':'補光'}catch(e){status('裝置不支援補光：'+e.message)}};
function crop(){const v=video.getBoundingClientRect(),g=$('guide').getBoundingClientRect();const s=Math.min(v.width/video.videoWidth,v.height/video.videoHeight);if(!s||!video.videoWidth)throw Error('鏡頭尚未準備完成');const x0=v.left+(v.width-video.videoWidth*s)/2,y0=v.top+(v.height-video.videoHeight*s)/2;const x=Math.max(0,(g.left-x0)/s),y=Math.max(0,(g.top-y0)/s),r=Math.min(video.videoWidth,(g.right-x0)/s),b=Math.min(video.videoHeight,(g.bottom-y0)/s);if(r<=x||b<=y)throw Error('掃描框不在影像內');canvas.width=Math.round(r-x);canvas.height=Math.round(b-y);canvas.getContext('2d').drawImage(video,x,y,r-x,b-y,0,0,canvas.width,canvas.height)}
async function recognize(kind,img){if(busy)return;busy=true;controls();const token=epoch;try{if(kind==='photo'){const scale=Math.min(1,2200/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height)}else crop();canvas.classList.add('visible');const mode=$('mode').value;if(mode==='meter'||mode==='module'){scanQR(mode,token);return}const w=await getWorker();if(token!==epoch)return;await w.setParameters({tessedit_char_whitelist:kind==='photo'?'':mode==='moduleOCR'?'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789':'0123456789',tessedit_pageseg_mode:kind==='photo'?'11':'7'});status('辨識中…');const {data}=await w.recognize(canvas);if(token!==epoch)return;$('result').textContent=data.text+'\nOCR 信心值：'+data.confidence.toFixed(1);const candidates=[...new Set(data.text.toUpperCase().match(mode==='moduleOCR'?/(?<![A-Z0-9])[A-Z0-9]{12}(?![A-Z0-9])/g:/(?<![0-9])[0-9]{11}(?![0-9])/g)||[])];if(candidates.length!==1){last='';count=0;status(candidates.length?'找到多組電號，請縮小掃描範圍。':'未找到符合長度的字串，請調整角度、距離或光線。');return}const n=candidates[0];if(kind==='continuous'){count=n===last?count+1:1;last=n;if(count<3){status('候選電號：'+n+'（'+count+'/3）');return}}$(mode==='moduleOCR'?'moduleNo':'number').value=n;validate();halt();navigator.vibrate?.(100);status('已辨識：'+n+'\n請與紙本核對後再使用。')}catch(e){if(token===epoch){halt();status('辨識失敗：'+e.message)}}finally{busy=false;controls();if(running)timer=setTimeout(()=>recognize('continuous'),250)}}
$('scan').onclick=()=>{if(running){halt();status('已停止辨識');return}if(busy)return;halt();running=true;$('scan').textContent='停止連續辨識';recognize('continuous')};$('once').onclick=()=>{halt();recognize('once')};$('photo').onchange=async e=>{const f=e.target.files[0];if(!f||busy)return;halt();try{const img=await createImageBitmap(f);await recognize('photo',img);img.close()}catch(err){status('圖片讀取失敗：'+err.message)}finally{e.target.value=''}};$('reset').onclick=()=>{halt();$('number').value='';$('result').textContent='';validate();status('已清除，請重新辨識。')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('number').value);status('已複製電號')}catch{ $('number').select();status('請手動複製選取的電號')}};const modes={power:'將完整 11 碼電號落在綠框內。',meter:'將完整電表 QR Code 放進綠框。',module:'將完整模組 QR Code 放進綠框。',moduleOCR:'將完整 12 碼序號放進綠框。'};
$('mode').onchange=()=>{halt();const m=$('mode').value;const qr=m==='meter'||m==='module';Object.assign($('guide').style,qr?{left:'12%',top:'8%',width:'76%',height:'84%'}:{left:'8%',top:'39%',width:'84%',height:'22%'});$('hint').textContent=modes[m];status('已切換：'+modes[m]);controls()};
function parseMeter(raw){const p=raw.trim().split(';').map(s=>s.trim());const match=p[1]?.match(/^([A-Z]{2})-[A-Z0-9]+$/);return p.length===4&&p[0]==='ACBEL'&&match&&/^[0-9]{8}$/.test(p[2])?{type:match[1],number:p[2]}:null}
function showParts(raw){$('parts').replaceChildren();for(const part of raw.split(/[;,|\s]+/).filter(Boolean)){for(const [label,id] of [['類型','meterType'],['表號','meterNo']]){const b=document.createElement('button');b.className='secondary';b.textContent=label+'：'+part;b.onclick=()=>{$(id).value=part};$('parts').append(b)}}}
function applyMeter(raw){$('rawQR').value=raw;$('meterType').value='';$('meterNo').value='';const parsed=parseMeter(raw);showParts(raw);if(parsed){$('meterType').value=parsed.type;$('meterNo').value=parsed.number;status('已解析電表 QR，請核對類型與表號。')}else{status('未知電表 QR 格式：請從原始內容選取或手動輸入類型與表號。')}}
$('parse').onclick=()=>{halt();applyMeter($('rawQR').value)};
function scanQR(mode,token){if(typeof jsQR!=='function')throw Error('QR 引擎未載入，請檢查網路');const img=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height);const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});if(token!==epoch)return;if(!code){status('未找到 QR Code，請調整距離或補光。');return}halt();$('result').textContent=code.data;navigator.vibrate?.(100);if(mode==='meter'){applyMeter(code.data)}else{$('moduleNo').value='';const s=code.data.trim();if(/^[A-Za-z0-9]{12}$/.test(s)){$('moduleNo').value=s;status('已取得模組序號，請核對標籤。')}else{status('未知模組 QR 格式：請查看辨識診斷，改用 OCR 或手動輸入。')}}}
$('copyAll').onclick=async()=>{const vals=[$('number').value,document.querySelector('input[name=operation]:checked')?.value||'',$('meterType').value.trim(),$('meterNo').value.trim(),$('moduleNo').value.trim()];if(!/^[0-9]{11}$/.test(vals[0])||!vals[1]||!vals[2]||!vals[3]||!/^[A-Za-z0-9]{12}$/.test(vals[4])||vals.some(v=>/[\t\r\n]/.test(v))){$('reportStatus').textContent='請確認五欄完整，電號 11 碼純數字、序號 12 碼英數。';return}try{await navigator.clipboard.writeText(vals.join('\t'));$('reportStatus').textContent='已複製五欄（Tab 分隔），未上傳。'}catch(e){$('reportStatus').textContent='無法複製：'+e.message}};
window.addEventListener('pagehide',stop);validate();controls();</script></body></html>
