<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b45"><title>電號掃描 V0.1a</title><style>*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f1f5f5;color:#18343a;margin:0}main{max-width:560px;margin:auto;padding:18px}h1{font-size:24px;margin:0}p{line-height:1.5}section{background:white;border:1px solid #d6e0e0;border-radius:14px;padding:16px;margin:14px 0}.preview{position:relative;background:#172429;aspect-ratio:4/3;overflow:hidden;border-radius:10px}video{width:100%;height:100%;object-fit:contain}#guide{position:absolute;border:2px solid #6cf2ab;box-shadow:0 0 0 999px #0007;pointer-events:none;left:8%;top:39%;width:84%;height:22%;border-radius:5px}button,input{font:inherit;padding:12px;border-radius:8px;border:1px solid #a5b8ba}button{background:#14675f;color:white;font-weight:600;cursor:pointer;flex:1}button.secondary{background:white;color:#18343a}button:disabled{opacity:.45}input{width:100%;font:26px monospace;letter-spacing:1px} .row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.muted{font-size:13px;color:#52676b}#status{min-height:48px;white-space:pre-wrap}#result{overflow-wrap:anywhere;font-family:monospace;font-size:14px}canvas{max-width:100%;display:none}canvas.visible{display:block}label{display:block;margin-bottom:8px;font-weight:600}</style></head><body><main><h1>電號掃描</h1><p class="muted">V0.1a · 本機 OCR 測試 · 不上傳施工資料</p><section><div class="preview" id="preview"><video id="video" playsinline muted></video><div id="guide"></div></div><p class="muted">將手機轉正，讓完整 11 碼電號落在綠框內。</p><div class="row"><button id="start">開啟鏡頭</button><button id="stop" class="secondary" disabled>關閉</button><button id="torch" class="secondary" disabled>補光</button></div><div class="row"><button id="scan" disabled>開始連續辨識</button><button id="once" class="secondary" disabled>單次辨識</button></div><label for="photo">或選擇測試照片（辨識整張圖）</label><input type="file" id="photo" accept="image/*" style="font:inherit;letter-spacing:0"><p id="status" role="status">尚未開啟鏡頭。</p></section><section><label for="number">電號（11 碼）</label><input id="number" inputmode="numeric" maxlength="11" autocomplete="off" placeholder="00000000000"><p id="valid" class="muted">等待輸入</p><div class="row"><button id="copy" disabled>複製電號</button><button id="reset" class="secondary">清除／重掃</button></div><details><summary>辨識診斷</summary><p id="result"></p><canvas id="canvas"></canvas></details></section><p class="muted">第一次使用需要網路下載 OCR 程式及模型。鏡頭需要 HTTPS 或 localhost。影像不會由本程式上傳；第三方 CDN 會收到資源下載請求。</p></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id);const video=$('video'),canvas=$('canvas');let stream=null,worker=null,workerPromise=null,busy=false,running=false,epoch=0,timer=null,last='',count=0,torch=false;const status=t=>$('status').textContent=t;function validate(){const ok=/^[0-9]{11}$/.test($('number').value);$('valid').textContent=ok?'格式正確（仍需核對原始電號）':'需要完整 11 碼純數字';$('copy').disabled=!ok} $('number').oninput=validate;
function halt(){running=false;epoch++;clearTimeout(timer);$('scan').textContent='開始連續辨識';last='';count=0}function controls(){const active=!!stream;$('start').disabled=active;$('stop').disabled=!active;$('scan').disabled=!active;$('once').disabled=!active||busy;$('photo').disabled=busy;$('torch').disabled=!stream?.getVideoTracks()[0]?.getCapabilities?.().torch}
async function getWorker(){if(worker)return worker;if(!workerPromise){workerPromise=(async()=>{if(!window.Tesseract)throw Error('OCR 程式未載入，請檢查網路');status('首次載入 OCR 模型…');const w=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='loading language traineddata')status('下載 OCR 模型… '+Math.round(m.progress*100)+'%')}});await w.setParameters({tessedit_char_whitelist:'0123456789',tessedit_pageseg_mode:'7'});worker=w;return w})().catch(e=>{workerPromise=null;throw e})}return workerPromise}
$('start').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('需要 HTTPS 或 localhost 才能開啟鏡頭');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();status('鏡頭已開啟，請對準電號。');controls()}catch(e){stop();status('無法開啟鏡頭：'+e.message)}};function stop(){halt();stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;torch=false;controls()}$('stop').onclick=()=>{stop();status('鏡頭已關閉')};$('torch').onclick=async()=>{try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:!torch}]});torch=!torch;$('torch').textContent=torch?'關補光':'補光'}catch(e){status('裝置不支援補光：'+e.message)}};
function crop(){const v=video.getBoundingClientRect(),g=$('guide').getBoundingClientRect();const s=Math.min(v.width/video.videoWidth,v.height/video.videoHeight);if(!s||!video.videoWidth)throw Error('鏡頭尚未準備完成');const x0=v.left+(v.width-video.videoWidth*s)/2,y0=v.top+(v.height-video.videoHeight*s)/2;const x=Math.max(0,(g.left-x0)/s),y=Math.max(0,(g.top-y0)/s),r=Math.min(video.videoWidth,(g.right-x0)/s),b=Math.min(video.videoHeight,(g.bottom-y0)/s);if(r<=x||b<=y)throw Error('掃描框不在影像內');canvas.width=Math.round(r-x);canvas.height=Math.round(b-y);canvas.getContext('2d').drawImage(video,x,y,r-x,b-y,0,0,canvas.width,canvas.height)}
async function recognize(kind,img){if(busy)return;busy=true;controls();const token=epoch;try{if(kind==='photo'){const scale=Math.min(1,2200/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height)}else crop();canvas.classList.add('visible');const w=await getWorker();if(token!==epoch)return;await w.setParameters({tessedit_char_whitelist:kind==='photo'?'':'0123456789',tessedit_pageseg_mode:kind==='photo'?'11':'7'});status('辨識中…');const {data}=await w.recognize(canvas);if(token!==epoch)return;$('result').textContent=data.text+'\nOCR 信心值：'+data.confidence.toFixed(1);const candidates=[...new Set(data.text.match(/(?<![0-9])[0-9]{11}(?![0-9])/g)||[])];if(candidates.length!==1){last='';count=0;status(candidates.length?'找到多組電號，請縮小掃描範圍。':'未找到完整 11 碼，請調整角度、距離或光線。');return}const n=candidates[0];if(kind==='continuous'){count=n===last?count+1:1;last=n;if(count<3){status('候選電號：'+n+'（'+count+'/3）');return}}$('number').value=n;validate();halt();navigator.vibrate?.(100);status('已辨識：'+n+'\n請與紙本核對後再使用。')}catch(e){if(token===epoch){halt();status('辨識失敗：'+e.message)}}finally{busy=false;controls();if(running)timer=setTimeout(()=>recognize('continuous'),250)}}
$('scan').onclick=()=>{if(running){halt();status('已停止辨識');return}if(busy)return;halt();running=true;$('scan').textContent='停止連續辨識';recognize('continuous')};$('once').onclick=()=>{halt();recognize('once')};$('photo').onchange=async e=>{const f=e.target.files[0];if(!f||busy)return;halt();try{const img=await createImageBitmap(f);await recognize('photo',img);img.close()}catch(err){status('圖片讀取失敗：'+err.message)}finally{e.target.value=''}};$('reset').onclick=()=>{halt();$('number').value='';$('result').textContent='';validate();status('已清除，請重新辨識。')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('number').value);status('已複製電號')}catch{ $('number').select();status('請手動複製選取的電號')}};window.addEventListener('pagehide',stop);validate();controls();</script></body></html>
